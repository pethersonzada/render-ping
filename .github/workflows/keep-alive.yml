name: Render Keep-Alive Contínuo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false 

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 355  

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Vigia do Render (Loop de 6 horas)
        env:
          SLEEP_SECONDS: "300"           
          MAX_RUNTIME_SECONDS: "21000"   
        run: |
          python keep_alive.py
